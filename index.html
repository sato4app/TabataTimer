<!DOCTYPE html>
<html lang="ja" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>TabataTimerPlus</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- React & Tailwind CSS -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            work: '#ff2a5f',
                            rest: '#10b981',
                            prep: '#3b82f6',
                            finish: '#a855f7'
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Inter', sans-serif;
        }
        .glow-work {
            filter: drop-shadow(0 0 25px rgba(255, 42, 95, 0.45));
        }
        .glow-rest {
            filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.45));
        }
        .glow-prep {
            filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.45));
        }
        .glow-finish {
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.45));
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            appearance: textfield; /* Standard syntax */
            -moz-appearance: textfield; /* Firefox */
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased h-full overflow-hidden">
    <noscript>このアプリはJavaScriptが必要です。</noscript>
    <div id="root" class="h-full w-full overflow-hidden"></div>

    <!-- Main Application Logic -->
    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js');
            });
        }
    </script>
</body>
</html>
